<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta name="author" content="Emmanuel Olannye">
        <meta name="description" content="My First Web Page">
        <meta name="keywords" content="html, css, web, web development, javascript">
        <script src="./assets/script/app.js" defer></script>
        <link rel="stylesheet" href="./assets/style/index.css" media="all">
        <!-- <link rel="icon" href="./assets/media/comic_icon.png" media="all"> -->
        <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Metal+Mania&display=swap" rel="stylesheet">
        <title>Shape Factory</title>
    </head>
    <body>
        <div class="container">
            <main>
                <h2>Shape Factory</h2>
                <!-- Shapes -->
                <div>
                    <button class="thisButton" id="thisButton">Create</button>
                    <select id="display-grid-box" name="display-grid-box">
                        <option value="square">A square</option>
                        <option value="circle">A circle</option>
                    </select>
                    <!-- Colors -->
                    <select id="display-grid-tank" name="display-grid-tank">
                        <option value="Red">Red</option>
                        <option value="Blue">Blue</option>
                        <option value="yellow">Yellow</option>
                        <option value="green">Green</option>
                    </select>
                </div>
                <div id="some-container">
                    <!-- <div class="square">box</div> -->
                </div>
                <p>Unit 3: orange square</p>
            </main>
            <style>
                @charset "utf-8";

                .container {
                    width: min(100% - 30px, 1080px);
                    margin-inline: auto;
                    /* background-color: black; */
                }

                body {
                    background-color: black;
                }

                h2 {
                    margin-top: 50px;
                    text-align: center;
                    color: white;
                    font-family: "Nunito Sans", sans-serif;
                    font-weight:300;
                }

                div {
                    display: flex;
                    margin-top: 20px;
                    /* flex-direction: column; */
                    justify-content:space-evenly;
                    padding: 30px;
                    align-items:center;
                    /* background-color:aliceblue; */

                }

                .square {
                    width: 100px;
                    height: 100px;
                }

                .circle {
                    border-radius: 50%
                }

                button {
                    color: white;
                    background-color: orange;
                    padding: 5px;
                    border-radius: 5px;
                    width: 120px;
                }

                button:hover {
                    border-color: gold;
                    cursor: pointer;
                }

                /* .square, .circle {
                    height: auto;
                    width: auto;
                } */

                #some-container {
                    display: grid;
                    grid-template-columns: repeat(5, 50px);
                    gap: 4px;
                    place-items: center;
                    /* justify-content:center;
                    align-items:center; */
                    background-color:grey;
                    height: 300px;
                    width: 400px;
                }

                select {
                    border-radius: 5px;
                    padding: 5px;
                    width: 120px;
                }

                select:hover {
                    border-color: aqua;
                    cursor: pointer;
                }

                p {
                    color: white;
                    text-align: center;
                    font-family: "Nunito Sans", sans-serif;
                    font-weight: 300;
                }



                /* .display-grid-box {
                    display: flex;
                    flex-direction: row;
                    justify-content:center;
                    align-items: center;
                    background-color: green;

                    circle {
                        border-radius: 50%;
                    }

                    square {
                        border-radius: 20px;
                    }
                } */
            </style>
        </div>
    </body>
</html>
